name = "sol-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "0.0.0.0"
port = 8787

[vars]
ENVIRONMENT = "development"
# SANITY_API_TOKEN and GITHUB_TOKEN are Cloudflare Secrets — not set here

[observability]
enabled = true

# Persistent, shared dev environment — the target for other repos' (sol-notify,
# integration-service) ephemeral per-PR environments. Expect it to be messy;
# staging stays reserved for sol-api's own pre-prod verification.
[env.dev]
name = "sol-api-dev"

[env.dev.vars]
ENVIRONMENT = "dev"

[env.dev.observability]
enabled = true

[env.staging]
name = "sol-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.observability]
enabled = true

[env.production]
name = "sol-api"

[env.production.vars]
ENVIRONMENT = "production"

[env.production.observability]
enabled = true
