name: Release

on:
  push:
    branches: [main]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Integration tests run against the persistent staging DB, and a
      # schema-changing PR's own tests may reference its new column(s)
      # immediately (see tests/integration/clients.test.ts's seed data) — so
      # staging must be migrated before tests run, not after. Mirrors the
      # migrate-then-test order pr.yml already uses for its ephemeral Neon
      # branch. deploy-staging's own migrate step stays as a harmless,
      # idempotent no-op safety net (Drizzle tracks applied migrations in
      # sol_api_migrations and skips anything already run).
      - name: Apply migrations to staging
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      - name: Run tests
        run: npm test -- --bail=1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          API_KEY: ${{ secrets.API_KEY_STAGING }}

  # Cuts a semantic-release version from Conventional Commit history on every
  # merge to main: bumps package.json, updates CHANGELOG.md, tags the commit,
  # and publishes a GitHub Release. Runs only after type-check and test both
  # pass, so a release is never cut for code that doesn't even build/test —
  # deploy correctness is verified separately below, by actually deploying it.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [type-check, test]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # package.json is bumped locally by semantic-release before it pushes
      # the release commit, so this reflects the version just released (or
      # the current version unchanged, if this run had nothing to release —
      # e.g. a chore/docs-only merge). deploy-staging and deploy-production
      # tag their Cloudflare deployments with it via --var APP_VERSION, and
      # it's surfaced at runtime by GET /health.
      - name: Read released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations to staging
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging --var APP_VERSION:${{ needs.release.outputs.version }}
      - name: Set staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.DATABASE_URL_STAGING }}" | npx wrangler secret put DATABASE_URL --env staging
          echo "${{ secrets.API_KEY_STAGING }}" | npx wrangler secret put API_KEY --env staging

  # Gated by the "production" GitHub Environment — requires manual approval
  # (see repo Settings → Environments → production) before this job starts.
  # Depends on both deploy-staging (code actually works when deployed) and
  # release (there's a version to tag this deployment with, and a release
  # this deployment corresponds to) — either one failing blocks production.
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, release]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations to production
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
      - name: Deploy to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production --var APP_VERSION:${{ needs.release.outputs.version }}
      - name: Set production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.DATABASE_URL_PRODUCTION }}" | npx wrangler secret put DATABASE_URL --env production
          echo "${{ secrets.API_KEY_PRODUCTION }}" | npx wrangler secret put API_KEY --env production
